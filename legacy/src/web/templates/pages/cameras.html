<!-- src/web/templates/pages/cameras.html: Регистрация физических RTSP камер отдельно от monitoring layout. -->
{% extends 'base.html' %}{% load static %}
{% block scripts %}<script type="module" src="{% static 'js/features/cameras.js' %}" defer></script>{% endblock %}
{% block content %}<div class="page__heading"><h1>Камеры</h1><p class="panel__hint">Подключения и контрольные линии</p></div>
<div class="split"><section class="panel"><h2 class="panel__title">Зарегистрированные камеры</h2><div class="camera-catalog" data-camera-catalog></div></section>
{% if can_configure %}<section class="panel"><h2 class="panel__title">Новая камера</h2><form class="form" data-camera-create><label class="form__field">Название<input name="name" maxlength="150" required></label><label class="form__field">Местоположение<input name="location" maxlength="250"></label><label class="form__field">RTSP URL<input name="url" placeholder="rtsp://10.0.0.25:554/stream1" required></label><label class="form__field">Логин<input name="username" autocomplete="off"></label><label class="form__field">Пароль<input type="password" name="password" autocomplete="new-password"></label><button class="button button--primary" type="submit">Зарегистрировать камеру</button></form></section>{% endif %}</div>{% endblock %}
