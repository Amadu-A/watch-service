<!-- templates/components/schedule.html: Полное недельное расписание с явным сохранением и 24:00. -->
<section class="panel" data-schedule-panel>
  <h2 class="panel__title">Расписание контроля</h2>
  <form class="form" data-schedule-form inert>
    <label class="form__field">Часовой пояс<select name="timezone" {% if not can_configure %}disabled{% endif %}><option>Europe/Moscow</option></select></label>
    <label class="form__switch">Контроль включён<input name="enabled" type="checkbox" {% if not can_configure %}disabled{% endif %}></label>
    <div class="schedule" data-schedule-intervals></div>
    {% if can_configure %}<div class="form__actions"><button disabled class="button button--link" type="button" data-interval-add>＋ Добавить интервал</button><button disabled class="button" type="submit">Сохранить</button></div>{% endif %}
  </form>
  <p class="panel__hint">Ночной интервал относится к дню начала. Полный день: 00:00 → 24:00. Без интервалов контроль выключен.</p>
</section>
