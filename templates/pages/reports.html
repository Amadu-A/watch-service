<!-- templates/pages/reports.html: Создание PDF/CSV отчёта и персональная история файлов. -->
{% extends 'base.html' %}{% load static %}
{% block scripts %}<script type="module" src="{% static 'js/features/reports.js' %}" defer></script>{% endblock %}
{% block content %}<h1>Отчёты</h1><section class="panel"><form class="form__actions" data-report-form><label class="form__field">Формат<select name="format"><option>PDF</option><option>CSV</option></select></label><label class="form__field">Камера<select name="camera_id" data-filter-camera><option value="">Все</option></select></label><label class="form__field">С<input name="date_from" type="datetime-local"></label><label class="form__field">До<input name="date_to" type="datetime-local"></label><label class="form__field">Направление<select name="direction"><option value="">Все</option><option>ENTRY</option><option>EXIT</option></select></label><label class="form__field">Отправка<select name="notification_status"><option value="">Все</option><option>SENT</option><option>FAILED</option><option>SKIPPED_DISABLED</option><option>DEAD</option></select></label><button disabled class="button button--primary" type="submit">Сформировать отчёт</button></form><p class="panel__hint">До 2000 событий в одном файле. Даты вводятся в часовом поясе браузера; в отчёте используется пояс объекта.</p><div data-report-history></div></section>{% endblock %}
