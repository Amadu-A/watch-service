<!-- templates/pages/violations.html: История, filters и pagination событий. -->
{% extends 'base.html' %}{% load static %}
{% block scripts %}<script type="module" src="{% static 'js/features/violations.js' %}" defer></script>{% endblock %}
{% block content %}<h1>Нарушения</h1><section class="panel"><form class="form__actions" data-violation-filter><label class="form__field">Камера<select name="camera_id" data-filter-camera><option value="">Все камеры</option></select></label><label class="form__field">Направление<select name="direction"><option value="">Все</option><option value="ENTRY">Вход</option><option value="EXIT">Выход</option></select></label><label class="form__field">С<input name="date_from" type="datetime-local"></label><label class="form__field">До<input name="date_to" type="datetime-local"></label><label class="form__field">Отправка<select name="notification_status"><option value="">Все статусы</option><option>SENT</option><option>FAILED</option><option>SKIPPED_DISABLED</option><option>DEAD</option></select></label><button disabled class="button button--primary" type="submit">Применить</button></form>{% include 'components/violation-table.html' %}<div class="pagination"><button class="button" type="button" data-page-prev disabled>← Назад</button><span data-page-label></span><button class="button" type="button" data-page-next disabled>Вперёд →</button></div></section>{% endblock %}
