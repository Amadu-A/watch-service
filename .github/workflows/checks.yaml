# .github/workflows/checks.yaml
# Проверки кода, схемы, frontend и пользовательских сценариев без внешних сервисов.
name: checks

on:
  push:
  pull_request:

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
      - name: Установить зависимости
        run: uv sync --frozen --no-extra vision
      - name: Проверить стиль Python
        run: |
          uv run --no-sync ruff check src tests manage.py
          uv run --no-sync ruff format --check src tests manage.py
      - name: Проверить Django и миграции
        run: |
          uv run --no-sync python manage.py check
          uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Проверить JavaScript
        run: |
          for source in static/js/*.js static/js/components/*.js static/js/features/*.js; do node --check "$source"; done
          node --test tests/frontend/*.test.mjs
      - name: Установить Chromium
        run: uv run --no-sync playwright install --with-deps --no-shell chromium
      - name: Выполнить Python и браузерные тесты
        env:
          RUN_E2E: 'true'
        run: uv run --no-sync pytest -q --tb=short --cov=src --cov-branch
